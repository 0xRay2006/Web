<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You?</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
    }

    .kitty-img {
      width: 240px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      color: #c2185b;
      margin-bottom: 2rem;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 2rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .yes-button, .no-button {
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .yes-button {
      background: #e91e63;
      color: #fff;
      font-size: 1.5rem;
      padding: 1rem 2.5rem;
    }

    .yes-button:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(233, 30, 99, 0.4);
    }

    .no-button {
      background: #b0bec5;
      color: #fff;
      font-size: 1rem;
      padding: 0.75rem 1.5rem;
    }

    .no-button:hover {
      background: #90a4ae;
    }
  </style>
</head>
<body>
  <img class="kitty-img" src="https://i.redd.it/pxez0ezarrib1.jpg" alt="Hello Kitty Love">
  <h1>Will you be my sweetheart?</h1>
  <div class="buttons">
    <button class="yes-button" onclick="handleYesClick()">Yes!</button>
    <button class="no-button" onclick="handleNoClick()">No</button>
  </div>

  <script>
    let messageIndex = 0;
    const messages = [
      "Are you sure?",
      "Really sure?",
      "Think about it again...",
      "I'll be so sad...",
      "Please? Pretty please?",
      "OK, let me ask one more time..."
    ];

    function handleNoClick() {
      const noButton = document.querySelector(".no-button");
      const yesButton = document.querySelector(".yes-button");

      noButton.textContent = messages[messageIndex];
      messageIndex = (messageIndex + 1) % messages.length;

      const currentSize = parseFloat(window.getComputedStyle(yesButton).fontSize);
      yesButton.style.fontSize = `${currentSize * 1.5}px`;
    }

    function handleYesClick() {
      window.location.href = "yes_page.html";
    }
  </script>
</body>
</html>
